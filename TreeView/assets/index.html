<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="/icons.js"></script>
<style>
@font-face {
    font-family: Poppins;
    src: url('/assets/google_fonts/Poppins-Light.ttf') format('truetype');
    font-weight: 300;
    font-style: normal;
}

* {
    box-sizing: border-box;
}

/* No styles on html/body: Symcon reserves the space for a tile title there.
   #treev stays in the normal flow below the title, if one is shown;
   fitHeight() sizes it to the space left down to the bottom of the viewport. */
#treev {
    display: block;
    overflow: auto;
    padding: 12px;
    font-family: Poppins, sans-serif;
    font-weight: 300;
    letter-spacing: .25px;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
}

.tree-empty {
    padding: 16px;
    opacity: .6;
    text-align: center;
}

.tree-node {
    position: relative;
}

.tree-row {
    position: relative;
    display: flex;
    align-items: center;
    min-height: 34px;
    border-radius: 6px;
    padding: 3px 10px 3px 4px;
    cursor: pointer;
    white-space: nowrap;
}

/* Hover and selection are drawn on pseudo elements so they combine with the node background. */
.tree-row::before,
.tree-row::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    z-index: 0;
    background: transparent;
}

.tree-row:hover::before {
    background: var(--treev-hover, rgba(127, 127, 127, .12));
}

.tree-row.selected::after {
    background: var(--treev-selection, rgba(77, 175, 80, .35));
}

.tree-row.selected {
    outline: 1px solid var(--treev-selection-outline, rgba(77, 175, 80, .72));
}

.tree-row > * {
    position: relative;
    z-index: 1;
}

.tree-indicator {
    position: relative;
    flex: 0 0 16px;
    width: 16px;
    height: 16px;
    margin-right: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 2;
}

.tree-indicator.box {
    border: 1px solid currentColor;
    border-radius: 1px;
    font: 600 12px/12px sans-serif;
    background: var(--tile-bg, transparent);
}

.tree-indicator.plusminus {
    font: 600 16px/16px sans-serif;
}

.tree-indicator.chevron {
    font: 700 19px/16px sans-serif;
}

.tree-indicator.leaf {
    visibility: hidden;
}

.tree-icon {
    flex: 0 0 20px;
    width: 20px;
    margin-right: 6px;
    text-align: center;
    opacity: .9;
}

.tree-icon i {
    font-size: .95em;
}

.tree-name {
    overflow: hidden;
    text-overflow: ellipsis;
}

.tree-value {
    margin-left: auto;
    padding-left: 14px;
    text-align: right;
    opacity: .9;
}

.tree-children {
    position: relative;
}

.tree-children.collapsed {
    display: none;
}

/* Classic box design: connect the parent box to its children without drawing inside the box.
   The "expanded" class is set in JavaScript (instead of :has(), which older WebKit lacks). */
.design-box .tree-node.expanded > .tree-row .tree-indicator.box::after {
    content: "";
    position: absolute;
    left: 7px;
    top: 15px;
    height: 10px;
    border-left: 1px solid rgba(127, 127, 127, .48);
    pointer-events: none;
}

.design-box .tree-node:not(.root)::before {
    content: "";
    position: absolute;
    left: var(--branch-x);
    top: 0;
    bottom: 0;
    border-left: 1px solid rgba(127, 127, 127, .48);
}

.design-box .tree-node:not(.root):last-child::before {
    bottom: auto;
    height: 17px;
}

.design-box .tree-node:not(.root)::after {
    content: "";
    position: absolute;
    left: var(--branch-x);
    top: 17px;
    width: calc(var(--branch-width) - 1px);
    border-top: 1px solid rgba(127, 127, 127, .48);
}
</style>
</head>
<body>
<div id="treev"><div class="tree-empty"></div></div>
<script>
const treeRoot = document.getElementById('treev');

let model = [];
let design = {};
let expanded = new Set();   // keys of expanded nodes
let selectedKey = '';       // key of the visually selected node

// ---------------------------------------------------------------------------
// Layout
// As in HiddenMenu: instead of reserving a fixed space for the tile title, the
// actual top of the tree is measured. It includes body margins, a tile title
// and wrapper offsets, so the tree starts directly below the title if one is
// shown and at the top otherwise.
// ---------------------------------------------------------------------------

// Bottom margin and padding of a page element, so the tree does not push the page into scrolling.
function bottomSpacing(element) {
    if (!element) {
        return 0;
    }
    const style = getComputedStyle(element);
    return (parseFloat(style.marginBottom) || 0) + (parseFloat(style.paddingBottom) || 0);
}

function fitHeight() {
    const viewport = window.visualViewport;
    const viewportBottom = Math.min(
        document.documentElement.clientHeight || window.innerHeight,
        viewport ? viewport.offsetTop + viewport.height : window.innerHeight
    );
    const top = Math.max(0, treeRoot.getBoundingClientRect().top);
    let height = viewportBottom - top - bottomSpacing(document.body) - bottomSpacing(document.documentElement);

    // Inside a wrapper element, never grow beyond the wrapper.
    const parent = treeRoot.parentElement;
    if (parent && parent !== document.body && parent !== document.documentElement) {
        height = Math.min(height, parent.getBoundingClientRect().bottom - top);
    }
    treeRoot.style.height = Math.max(0, Math.floor(height)) + 'px';
}

if (window.ResizeObserver && treeRoot.parentElement) {
    new ResizeObserver(fitHeight).observe(treeRoot.parentElement);
}
window.addEventListener('resize', fitHeight);
if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitHeight);
}
fitHeight();

// A node key is its JSON-encoded ID path, e.g. '["heating","flow"]'.
const keyOf = path => JSON.stringify(path);

// Client ID per page load, sent with each click so target scripts can address only this client (…Ex functions).
// Not kept in sessionStorage: a duplicated browser tab would otherwise share the ID.
// crypto.randomUUID only exists in secure contexts (HTTPS/localhost).
const clientID = (window.crypto && typeof crypto.randomUUID === 'function')
    ? crypto.randomUUID()
    : Math.random().toString(36).slice(2) + Date.now().toString(36);

// ---------------------------------------------------------------------------
// Local UI state
// Scoped to this TreeView instance and this browser tab. sessionStorage may be
// unavailable in sandboxed visualizations: all accesses are guarded.
// ---------------------------------------------------------------------------

function stateKey() {
    return 'treev.ui.v1.' + String(window.__treevInstanceID || 'unknown');
}

function readLocalState() {
    try {
        const state = JSON.parse(sessionStorage.getItem(stateKey()) || 'null');
        return state && typeof state === 'object' ? state : null;
    } catch (e) {
        return null;
    }
}

function saveLocalState() {
    try {
        sessionStorage.setItem(stateKey(), JSON.stringify({ expanded: [...expanded], selectedKey }));
    } catch (e) {
        // State is not persisted; the tree still works.
    }
}

function restoreLocalState() {
    const state = readLocalState();
    if (!state) {
        expanded = new Set();
        selectedKey = '';
        return;
    }
    expanded = new Set(Array.isArray(state.expanded) ? state.expanded.filter(k => typeof k === 'string') : []);
    selectedKey = typeof state.selectedKey === 'string' ? state.selectedKey : '';
    pruneExpanded();
    pruneSelection();
}

// ---------------------------------------------------------------------------
// Messages from the module
// ---------------------------------------------------------------------------

function handleMessage(message) {
    let data = message;
    if (typeof data === 'string') {
        try {
            data = JSON.parse(data);
        } catch (e) {
            console.error(e);
            return;
        }
    }
    if (!data || typeof data !== 'object') {
        return;
    }
    // Messages addressed to another client are ignored; messages without client apply to all.
    if (data.client && data.client !== clientID) {
        return;
    }

    switch (data.type) {
        case 'full':
            model = Array.isArray(data.tree) ? data.tree : [];
            design = data.design || {};
            applyDesignClass();
            restoreLocalState();
            saveLocalState();
            render(data.emptyText || '');
            break;

        case 'tree':
            if (data.move) {
                remapExpanded(data.move.from || [], data.move.to || []);
                remapSelected(data.move.from || [], data.move.to || []);
            }
            model = Array.isArray(data.tree) ? data.tree : [];
            design = data.design || design;
            applyDesignClass();
            pruneExpanded();
            pruneSelection();
            saveLocalState();
            render(data.emptyText || '');
            break;

        case 'value':
            updateValue(Number(data.variableID), String(data.value ?? ''));
            break;

        case 'select': {
            const path = Array.isArray(data.path) ? data.path : [];
            if (path.length) {
                selectLocally(path);
            } else {
                selectedKey = '';
                saveLocalState();
                render();
            }
            if (Number(data.navigateTarget) > 1) {
                navigateToTarget(Number(data.navigateTarget));
            }
            break;
        }

        case 'expand':
        case 'collapse': {
            const key = keyOf(data.path || []);
            if (data.type === 'expand') {
                expanded.add(key);
            } else {
                expanded.delete(key);
            }
            saveLocalState();
            render();
            break;
        }

        case 'expandAll':
            expanded = new Set();
            walk(model, [], (node, path) => {
                if (hasChildren(node)) {
                    expanded.add(keyOf(path));
                }
            });
            saveLocalState();
            render();
            break;

        case 'collapseAll':
            expanded = new Set();
            saveLocalState();
            render();
            break;
    }
}

// ---------------------------------------------------------------------------
// Tree helpers
// ---------------------------------------------------------------------------

function hasChildren(node) {
    return (node.Children || []).length > 0;
}

function findNode(nodes, path) {
    if (!path.length) {
        return null;
    }
    const [id, ...rest] = path;
    const node = nodes.find(n => n.ID === id);
    if (!node) {
        return null;
    }
    return rest.length ? findNode(node.Children || [], rest) : node;
}

function walk(nodes, parentPath, callback) {
    for (const node of nodes) {
        const path = [...parentPath, node.ID];
        callback(node, path);
        walk(node.Children || [], path, callback);
    }
}

function isPrefix(prefix, path) {
    return prefix.length <= path.length && prefix.every((id, i) => id === path[i]);
}

function parseKey(key) {
    try {
        const path = JSON.parse(key);
        return Array.isArray(path) ? path : null;
    } catch (e) {
        return null;
    }
}

// Removes keys of nodes that no longer exist or have no children.
function pruneExpanded() {
    const valid = new Set();
    walk(model, [], (node, path) => {
        if (hasChildren(node)) {
            valid.add(keyOf(path));
        }
    });
    expanded = new Set([...expanded].filter(key => valid.has(key)));
}

function pruneSelection() {
    if (!selectedKey) {
        return;
    }
    const path = parseKey(selectedKey);
    if (!path || !findNode(model, path)) {
        selectedKey = '';
    }
}

// After a node was moved (SetNodeParent), keys below the old path move to the new path.
function remapExpanded(from, to) {
    if (!from.length) {
        return;
    }
    const next = new Set();
    for (const key of expanded) {
        let path = parseKey(key);
        if (!path) {
            continue;
        }
        if (isPrefix(from, path)) {
            path = [...to, ...path.slice(from.length)];
        }
        next.add(keyOf(path));
    }
    expanded = next;
}

function remapSelected(from, to) {
    if (!selectedKey || !from.length) {
        return;
    }
    const path = parseKey(selectedKey);
    if (!path) {
        selectedKey = '';
    } else if (isPrefix(from, path)) {
        selectedKey = keyOf([...to, ...path.slice(from.length)]);
    }
}

// ---------------------------------------------------------------------------
// Selection and automatic collapse
// ---------------------------------------------------------------------------

function autoCollapseMode() {
    return String(design.autoCollapseMode || 'Off');
}

// Keeps only the branches on the selected path open (plus the selected node itself if it has children).
function collapseCompeting(path, selectedHasChildren) {
    const keep = new Set();
    for (const key of expanded) {
        const other = parseKey(key);
        if (other && (isPrefix(other, path) || isPrefix(path, other))) {
            keep.add(key);
        }
    }
    expanded = keep;
    for (let i = 1; i < path.length; i++) {
        expanded.add(keyOf(path.slice(0, i)));
    }
    if (selectedHasChildren) {
        expanded.add(keyOf(path));
    }
}

// Opens exactly the path to the node (mode "Always", when expanding by indicator).
function setAutoExpanded(path) {
    expanded = new Set();
    for (let i = 1; i <= path.length; i++) {
        expanded.add(keyOf(path.slice(0, i)));
    }
}

function selectLocally(path) {
    selectedKey = keyOf(path);
    if (autoCollapseMode() !== 'Off') {
        const node = findNode(model, path);
        collapseCompeting(path, !!node && hasChildren(node));
    }
    saveLocalState();
    render();
}

function toggleExpanded(path, isOpen) {
    const key = keyOf(path);
    if (isOpen) {
        expanded.delete(key);
    } else if (autoCollapseMode() === 'Always') {
        setAutoExpanded(path);
    } else {
        expanded.add(key);
    }
    saveLocalState();
    render();
}

function navigateToTarget(targetID) {
    if (!Number.isInteger(targetID) || targetID <= 1) {
        return;
    }
    try {
        if (typeof openObject === 'function') {
            openObject(targetID);
        } else {
            console.warn('TreeView: openObject is unavailable');
        }
    } catch (e) {
        console.error('TreeView navigation failed', e);
    }
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------

function applyDesignClass() {
    treeRoot.classList.remove('design-box', 'design-plusminus', 'design-chevron');
    treeRoot.classList.add('design-' + indicatorStyle());
}

function indicatorStyle() {
    return String(design.indicator || 'Box').toLowerCase();
}

function iconClass(name) {
    // Symcon kit icons take precedence over Font Awesome icons with the same name.
    const fa = window.FontAwesome;
    try {
        if (typeof fa?.findIconDefinition === 'function' && fa.findIconDefinition({ prefix: 'fak', iconName: name })) {
            return 'fa-kit fa-' + name;
        }
    } catch (e) {
        // Fall back to Font Awesome.
    }
    return 'fa-light fa-' + name;
}

function visibleIcon(value) {
    const icon = String(value || '').trim();
    return icon.toLowerCase() === 'transparent' ? '' : icon;
}

function refreshFontAwesomeIcons() {
    const fa = window.FontAwesome;
    if (!fa || !fa.dom || typeof fa.dom.i2svg !== 'function') {
        return;
    }
    try {
        const result = fa.dom.i2svg({ node: treeRoot });
        if (result && typeof result.catch === 'function') {
            result.catch(e => console.warn('TreeView: icon conversion failed', e));
        }
    } catch (e) {
        console.warn('TreeView: icon conversion failed', e);
    }
}

function rgb(color) {
    return { r: (color >> 16) & 255, g: (color >> 8) & 255, b: color & 255 };
}

function tintColor(color) {
    const c = rgb(Number(color));
    return `rgba(${c.r}, ${c.g}, ${c.b}, .125)`;
}

function render(emptyText) {
    treeRoot.innerHTML = '';
    if (!model.length) {
        const empty = document.createElement('div');
        empty.className = 'tree-empty';
        empty.textContent = emptyText || 'No nodes configured';
        treeRoot.appendChild(empty);
        return;
    }
    // Siblings only reserve space for an indicator if at least one of them has children.
    const showIndicators = model.some(hasChildren);
    for (const node of model) {
        treeRoot.appendChild(makeNode(node, [], 0, showIndicators));
    }
    refreshFontAwesomeIcons();
}

function makeNode(node, parentPath, level, showIndicator) {
    const path = [...parentPath, node.ID];
    const key = keyOf(path);
    const children = node.Children || [];
    const isOpen = expanded.has(key);
    const indent = Number(design.indent) || 20;

    const wrap = document.createElement('div');
    wrap.className = 'tree-node';
    if (level === 0) {
        wrap.classList.add('root');
    }
    if (children.length && isOpen) {
        wrap.classList.add('expanded');
    }
    // Position of the connector lines (box design).
    const rowLeft = level * indent;
    const branchX = Math.max(0, rowLeft - indent + 12);
    wrap.style.setProperty('--branch-x', `${branchX}px`);
    wrap.style.setProperty('--branch-width', `${Math.max(0, rowLeft - branchX)}px`);

    const row = makeRow(node, path, level, rowLeft, isOpen, showIndicator);
    wrap.appendChild(row);

    if (children.length) {
        const childContainer = document.createElement('div');
        childContainer.className = 'tree-children' + (isOpen ? '' : ' collapsed');
        const childIndicators = children.some(hasChildren);
        for (const child of children) {
            childContainer.appendChild(makeNode(child, path, level + 1, childIndicators));
        }
        wrap.appendChild(childContainer);
    }
    return wrap;
}

function makeRow(node, path, level, rowLeft, isOpen, showIndicator) {
    const row = document.createElement('div');
    row.className = 'tree-row';
    if (selectedKey === keyOf(path)) {
        row.classList.add('selected');
    }
    row.style.marginLeft = `${rowLeft}px`;

    const initialScale = Number(design.initialFontScale) || 100;
    const scalePerLevel = Number(design.fontScale) || 100;
    const minScale = Number(design.minFontScale) || 75;
    row.style.fontSize = `${Math.max(minScale, initialScale * Math.pow(scalePerLevel / 100, level))}%`;

    if (node.Background !== undefined && Number(node.Background) >= 0) {
        row.style.backgroundColor = tintColor(node.Background);
    }

    if (showIndicator) {
        row.appendChild(makeIndicator(node, path, isOpen));
    }

    const icon = visibleIcon(node.EffectiveIcon);
    if (design.showIcons && icon) {
        const iconWrap = document.createElement('span');
        iconWrap.className = 'tree-icon';
        const i = document.createElement('i');
        i.className = iconClass(icon.toLowerCase());
        iconWrap.appendChild(i);
        row.appendChild(iconWrap);
    }

    const name = document.createElement('span');
    name.className = 'tree-name';
    name.textContent = node.Name || node.ID;
    row.appendChild(name);

    if (design.showValues && Number(node.VariableID) > 1) {
        const value = document.createElement('span');
        value.className = 'tree-value';
        value.dataset.variableId = String(node.VariableID);
        value.textContent = node.Value || '';
        row.appendChild(value);
    }

    row.addEventListener('click', () => {
        selectLocally(path);
        requestAction('UserSelect', JSON.stringify({ client: clientID, path }));
        // Scripts are run by the module; other targets are opened on this client only.
        if (!node.TargetIsScript && Number(node.TargetID) > 1) {
            navigateToTarget(Number(node.TargetID));
        }
    });
    return row;
}

function makeIndicator(node, path, isOpen) {
    const style = indicatorStyle();
    const indicator = document.createElement('span');
    indicator.className = 'tree-indicator ' + style;
    if (!hasChildren(node)) {
        indicator.classList.add('leaf');
    }
    if (style === 'chevron') {
        indicator.textContent = isOpen ? '⌄' : '›';
    } else {
        indicator.textContent = isOpen ? '−' : '+';
    }
    indicator.addEventListener('click', event => {
        event.stopPropagation();
        if (hasChildren(node)) {
            toggleExpanded(path, isOpen);
        }
    });
    return indicator;
}

function updateValue(variableID, value) {
    // Update the model as well: render() rebuilds the tree from it, e.g. on selection.
    const updateNodes = nodes => (nodes || []).forEach(node => {
        if (Number(node.VariableID) === variableID) {
            node.Value = value;
        }
        updateNodes(node.Children);
    });
    updateNodes(model);

    document.querySelectorAll(`.tree-value[data-variable-id="${variableID}"]`).forEach(element => {
        element.textContent = value;
    });
}
</script>
</body>
</html>
